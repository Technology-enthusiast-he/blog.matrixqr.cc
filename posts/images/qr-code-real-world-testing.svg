<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Test a QR code in real-world conditions</title>
<desc id="desc">Three test cards show checking a QR code on a phone, on a printed sample at its real size, and under realistic lighting and distance. The diagram is a testing checklist.</desc>
<rect width="1200" height="630" rx="28" fill="#080d1a"/>
<text x="64" y="76" fill="#f8fafc" font-family="Arial,sans-serif" font-size="34" font-weight="700">Test the exported code, not just the preview</text>
<text x="64" y="112" fill="#94a3b8" font-family="Arial,sans-serif" font-size="18">A quick three-part check before publishing or printing</text>
<g transform="translate(64 160)">
 <rect width="330" height="380" rx="20" fill="#111c30" stroke="#334155"/>
 <rect x="116" y="42" width="98" height="170" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
 <rect x="127" y="57" width="76" height="132" rx="5" fill="#e2e8f0"/>
 <path d="M138 80h16v16h-16z M162 80h16v16h-16z M138 104h16v16h-16z M174 104h16v16h-16z M150 128h16v16h-16z M174 140h16v16h-16z" fill="#0f172a"/>
 <path d="M150 221l16 16 33 -36" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="165" y="282" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="22" font-weight="700">Multiple devices</text>
 <text x="165" y="313" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Try different phones or</text><text x="165" y="336" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">scanning apps.</text>
</g>
<g transform="translate(435 160)">
 <rect width="330" height="380" rx="20" fill="#111c30" stroke="#334155"/>
 <rect x="65" y="48" width="200" height="155" rx="8" fill="#f8fafc"/>
 <rect x="86" y="65" width="82" height="82" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
 <path d="M96 75h18v18H96z M136 75h18v18h-18z M96 115h18v18H96z M126 95h18v18h-18z M146 125h12v12h-12z" fill="#0f172a"/>
 <path d="M180 80h62 M180 100h62 M180 120h48 M86 165h158" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
 <text x="165" y="282" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="22" font-weight="700">Actual print size</text>
 <text x="165" y="313" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Proof a printed sample at</text><text x="165" y="336" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">the intended dimensions.</text>
</g>
<g transform="translate(806 160)">
 <rect width="330" height="380" rx="20" fill="#111c30" stroke="#334155"/>
 <circle cx="165" cy="118" r="60" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
 <circle cx="165" cy="118" r="37" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="7 7"/>
 <path d="M165 77v42l28 18" fill="none" stroke="#fde68a" stroke-width="5" stroke-linecap="round"/>
 <path d="M92 202l18 -18 M238 202l-18 -18" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
 <text x="165" y="282" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="22" font-weight="700">Real conditions</text>
 <text x="165" y="313" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Check lighting, glare, angle,</text><text x="165" y="336" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">and scanning distance.</text>
</g>
<text x="64" y="590" fill="#64748b" font-family="Arial,sans-serif" font-size="14">Repeat the test after changing logo size, colors, borders, or export dimensions.</text>
</svg>