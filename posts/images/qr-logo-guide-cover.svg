<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">How to add a logo to a QR code without breaking it</title>
<desc id="desc">A custom illustration of a QR code with a modest centered logo, surrounded by guidance labels for contrast, quiet zone, and scan reliability.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102b46"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
  <pattern id="modules" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#f8fafc"/><rect width="12" height="12" fill="#0f172a"/><rect x="12" y="12" width="12" height="12" fill="#0f172a"/></pattern>
  <g id="finder"><rect width="72" height="72" rx="3" fill="#0f172a"/><rect x="12" y="12" width="48" height="48" fill="#f8fafc"/><rect x="24" y="24" width="24" height="24" fill="#0f172a"/></g>
</defs>
<rect width="1200" height="630" rx="28" fill="url(#bg)"/>
<circle cx="1060" cy="60" r="210" fill="#0891b2" opacity=".10"/><circle cx="100" cy="600" r="220" fill="#2563eb" opacity=".12"/>
<text x="64" y="78" fill="#67e8f9" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">MATRIXQR GUIDE</text>
<text x="64" y="148" fill="#f8fafc" font-family="Arial,sans-serif" font-size="43" font-weight="700">Add a Logo to a QR Code</text>
<text x="64" y="202" fill="#f8fafc" font-family="Arial,sans-serif" font-size="43" font-weight="700">Without Breaking It</text>
<text x="66" y="250" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="21">Protect scan reliability with a modest logo,</text>
<text x="66" y="280" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="21">clear contrast, and a preserved quiet zone.</text>
<g transform="translate(700 72)">
  <rect x="0" y="0" width="420" height="470" rx="28" fill="#0b1728" stroke="#334155" stroke-width="2"/>
  <rect x="42" y="42" width="336" height="336" rx="8" fill="#f8fafc" stroke="#22d3ee" stroke-width="3"/>
  <rect x="58" y="58" width="304" height="304" fill="url(#modules)"/>
  <use href="#finder" x="58" y="58"/><use href="#finder" x="290" y="58"/><use href="#finder" x="58" y="290"/>
  <g fill="#0f172a"><rect x="202" y="82" width="24" height="24"/><rect x="226" y="106" width="24" height="24"/><rect x="178" y="130" width="24" height="24"/><rect x="250" y="154" width="24" height="24"/><rect x="202" y="178" width="24" height="24"/><rect x="274" y="202" width="24" height="24"/><rect x="178" y="226" width="24" height="24"/><rect x="226" y="250" width="24" height="24"/><rect x="274" y="274" width="24" height="24"/></g>
  <rect x="166" y="166" width="88" height="88" rx="18" fill="#ffffff" stroke="url(#accent)" stroke-width="5"/>
  <rect x="185" y="185" width="50" height="50" rx="12" fill="url(#accent)"/>
  <path d="M196 210l10 10 20-22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="94" y="404" width="232" height="40" rx="20" fill="#083344" stroke="#155e75"/>
  <circle cx="116" cy="424" r="6" fill="#22d3ee"/>
  <text x="132" y="430" fill="#a5f3fc" font-family="Arial,sans-serif" font-size="16" font-weight="700">TEST THE FINAL DESIGN</text>
</g>
<g font-family="Arial,sans-serif" font-size="16" font-weight="700">
  <rect x="64" y="350" width="170" height="44" rx="22" fill="#0f2d42" stroke="#155e75"/><circle cx="86" cy="372" r="6" fill="#22d3ee"/><text x="102" y="378" fill="#cffafe">Keep contrast</text>
  <rect x="64" y="410" width="190" height="44" rx="22" fill="#0f2d42" stroke="#155e75"/><circle cx="86" cy="432" r="6" fill="#22d3ee"/><text x="102" y="438" fill="#cffafe">Protect quiet zone</text>
  <rect x="64" y="470" width="188" height="44" rx="22" fill="#0f2d42" stroke="#155e75"/><circle cx="86" cy="492" r="6" fill="#22d3ee"/><text x="102" y="498" fill="#cffafe">Keep logo modest</text>
</g>
<text x="64" y="584" fill="#64748b" font-family="Arial,sans-serif" font-size="15">Illustration only — always test the exported QR code on real devices.</text>
</svg>