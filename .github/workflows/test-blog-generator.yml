name: Test Blog Generator

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check scripts/generate-llms.js

      - name: Install build dependencies
        run: npm install --no-package-lock

      - name: Run full site build
        run: npm run build

      - name: Check generated LLMs files
        run: |
          node -e "
          const fs = require('fs');
          const short = fs.readFileSync('llms.txt', 'utf8');
          const full = fs.readFileSync('llms-full.txt', 'utf8');
          const urls = [...full.matchAll(/^- URL: (https?:\\/\\/\\S+)$/gm)].map(m => m[1]);
          if (!short.startsWith('# MatrixQR Blog')) throw new Error('llms.txt has an invalid heading');
          if (!full.startsWith('# MatrixQR Blog — Full Article Text')) throw new Error('llms-full.txt has an invalid heading');
          if (full.includes('Zero Tracker Guarantee')) throw new Error('Outdated absolute privacy claim remains');
          if (!urls.length) throw new Error('No article URLs were generated');
          if (new Set(urls).size !== urls.length) throw new Error('Duplicate article URLs were generated');
          console.log('PASS: LLMs files are readable; article URLs:', urls.length);
          "

      - name: Check generated JSON
        run: |
          node -e "
          const fs = require('fs');
          const posts = JSON.parse(fs.readFileSync('posts.json', 'utf8'));

          if (!Array.isArray(posts)) {
            throw new Error('posts.json is not an array');
          }

          console.log('Total indexed posts:', posts.length);

          if (posts.length === 0) {
            throw new Error('No posts were indexed');
          }

          for (const post of posts) {
            if (!post.title || !post.datePublished || !post.url) {
              throw new Error('Missing required fields: ' + JSON.stringify(post));
            }
          }

          for (let i = 1; i < posts.length; i++) {
            if (new Date(posts[i - 1].datePublished) < new Date(posts[i].datePublished)) {
              throw new Error('Posts are not sorted newest first');
            }
          }

          console.log('PASS: Required fields and date sorting are valid.');
          console.log('First 5 posts:');
          console.log(JSON.stringify(posts.slice(0, 5), null, 2));
          "
