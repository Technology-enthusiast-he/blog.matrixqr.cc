name: Update LLMs files

on:
  push:
    branches:
      - main
      - master
      - feat/automate-llms-files
    paths:
      - "posts/**/*.html"
      - "scripts/generate-llms.js"
      - "scripts/filter-llms-external-links.js"
      - "package.json"
      - ".github/workflows/update-llms.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-llms:
    name: Generate and commit LLMs files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate LLMs files
        run: |
          node scripts/generate-llms.js
          node scripts/filter-llms-external-links.js

      - name: Validate generated LLMs files
        run: |
          node --test scripts/generate-llms.test.js scripts/filter-llms-external-links.test.js
          node - <<'NODE'
          const fs = require('fs');
          const allowed = new Set([
            'blog.matrixqr.cc',
            'www.matrixqr.cc',
            'matrixqr.cc',
            'menu.matrixqr.cc',
          ]);
          const files = ['llms.txt', 'llms-full.txt'];
          const urlPattern = /https?:\/\/[^\s<>'"`\]\}]+/gi;

          for (const file of files) {
            const text = fs.readFileSync(file, 'utf8');
            if (file === 'llms.txt' && !text.startsWith('# MatrixQR Blog')) {
              throw new Error('Invalid llms.txt heading');
            }
            if (file === 'llms-full.txt' && !text.startsWith('# MatrixQR Blog — Full Article Text')) {
              throw new Error('Invalid llms-full.txt heading');
            }

            for (const match of text.matchAll(urlPattern)) {
              const candidate = match[0].replace(/[.,!?;:]+$/, '');
              let parsed;
              try {
                parsed = new URL(candidate);
              } catch {
                continue;
              }
              if (parsed.protocol !== 'https:' || !allowed.has(parsed.hostname.toLowerCase())) {
                throw new Error(`Third-party URL remains in ${file}: ${candidate}`);
              }
            }
          }

          console.log('PASS: llms.txt and llms-full.txt contain only allowed first-party HTTPS URLs.');
          NODE

      - name: Commit generated LLMs files
        run: |
          if git diff --quiet -- llms.txt llms-full.txt; then
            echo "No LLMs file changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llms.txt llms-full.txt
          git commit -m "chore: update generated LLMs files"
          git push
