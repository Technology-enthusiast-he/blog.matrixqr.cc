<script src="/scripts/renderList.js"></script>
<script src="/scripts/pagination.js"></script>
<script>
(function () {
  const path = window.location.pathname.replace(/\/$/, '');
  let currentPage = 1;
  if (path.includes('/page/')) {
    const m = path.match(/\/page\/(\d+)$/);
    currentPage = m ? parseInt(m[1], 10) : 1;
  }

  // 直接读内联数据，不再 fetch
  const posts = window.MATRIX_POSTS || [];
  if (!posts.length) {
    document.getElementById('blog-list').innerHTML =
      '<p class="text-red-400 text-sm">⚠️ MATRIX_POSTS 数据为空，请检查内联 script。</p>';
  }

  const { items, totalPages } = MatrixBlog.paginate(posts, currentPage);

  if (currentPage > totalPages && totalPages >= 1) { window.location.href = '/'; return; }

  const listEl = document.getElementById('blog-list');
  if (items.length === 0) {
    listEl.innerHTML = '<p class="text-slate-400 text-sm">No articles yet. Check back soon.</p>';
  } else {
    listEl.innerHTML = items.map(MatrixBlog.cardHTML).join('');
  }

  MatrixPager({ currentPage, totalPages, baseUrl: '' });
})();
</script>
